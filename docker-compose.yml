services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: civicai-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-civicai_db}
      MYSQL_USER: ${DB_USERNAME:-civic_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-civic_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - civicai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python FastAPI AI Microservice
  ai-service:
    build:
      context: ./civicai-ai-service
      dockerfile: Dockerfile
    container_name: civicai-ai-service
    restart: always
    environment:
      - PORT=8000
      - CORS_ALLOWED_ORIGINS=*
    ports:
      - "8000:8000"
    networks:
      - civicai-network

  # Spring Boot Backend (Serving REST API + Angular SPA static bundle)
  backend:
    build:
      context: ./civicai-backend
      dockerfile: Dockerfile
    container_name: civicai-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${DB_NAME:-civicai_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-civic_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-civic_pass}
      - JWT_SECRET=${JWT_SECRET:-civicAI_super_secret_jwt_key_2026_production_safe_string_minimum_256_bits}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - AI_SERVICE_URL=http://ai-service:8000
      - UPLOAD_DIR=/app/uploads
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - civicai-network

networks:
  civicai-network:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
