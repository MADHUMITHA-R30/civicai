<div class="container register-container">
  <div class="glass-card register-card">
    <div class="register-header">
      <div class="register-logo">📝</div>
      <h2>Citizen Registration</h2>
      <p>Create your CivicAI citizen account to report and track municipal issues</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      ⚠️ {{ errorMessage }}
    </div>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" [(ngModel)]="name" name="name" class="form-control" placeholder="e.g. Ramesh Kumar" required />
      </div>

      <div class="form-group">
        <label>Mobile Phone Number</label>
        <input type="tel" [(ngModel)]="mobile" name="mobile" class="form-control" placeholder="10-digit mobile number" />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="name@example.com" />
      </div>

      <div class="form-group">
        <label>Password *</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Minimum 6 characters" required />
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="isLoading || !name || !password">
        <span *ngIf="!isLoading">CREATE CITIZEN ACCOUNT</span>
        <span *ngIf="isLoading">Creating account...</span>
      </button>
    </form>

    <div class="login-prompt">
      Already have an account? <a routerLink="/login">Sign In</a>
    </div>
  </div>
</div>
