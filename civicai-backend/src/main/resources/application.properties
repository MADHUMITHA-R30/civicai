server.port=${PORT:8080}
spring.application.name=civicai-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Database Configuration (Defaults to embedded H2 for zero-friction local run, overrides with cloud MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:civicaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security (Override with a strong random 256-bit secret in cloud)
civicai.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
civicai.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# File Storage (Local directory or mounted volume in containers)
civicai.app.uploadDir=${UPLOAD_DIR:uploads}

# AI Microservice URL (Localhost or internal container/cloud DNS)
civicai.ai.serviceUrl=${AI_SERVICE_URL:http://localhost:8000}

# CORS Configuration (Comma-separated origins, or * for open access)
civicai.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:*}
